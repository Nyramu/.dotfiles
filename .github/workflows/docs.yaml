name: Deploy Docs
on:
  push:
    branches: [main]
    paths:
      - 'modules/nyra/**'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: cachix/install-nix-action@v31
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}
          extra_nix_config: |
            experimental-features = nix-command flakes pipe-operators
      - uses: cachix/cachix-action@v17
        with:
          name: nyra-dots
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
      - name: Generate docs
        run: |
          nix build .#docs-nixos --out-link docs-nixos
          nix build .#docs-hm --out-link docs-hm

          mkdir -p docs-site/nixos docs-site/hm
          cp -rL docs-nixos/* docs-site/nixos/
          cp -rL docs-hm/* docs-site/hm/

          mkdir -p docs-index
          cat > docs-index/index.md <<'EOF'
          # Nyra Options

          - [NixOS options](nixos/options.html)
          - [Home Manager options](hm/options.html)
          EOF

          nix run .#ndg -- html \
            --input-dir docs-index \
            --output-dir docs-site \
            --title "Nyra Options"
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./docs-site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to Github Pages
        uses: actions/deploy-pages@v4
        id: deployment
